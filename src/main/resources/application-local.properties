# Explicitly opt in: SPRING_PROFILES_ACTIVE=local
# Local-only Docker database. Must never use Neon production credentials.
spring.datasource.url=${FINFLOW_DEV_JDBC_URL:jdbc:postgresql://localhost:55432/finflow_dev}
spring.datasource.username=${FINFLOW_DEV_DB_USER:finflow_dev}
spring.datasource.password=${FINFLOW_DEV_DB_PASSWORD:finflow_local_only_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Auto-create/update tables ONLY for local, disposable databases.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8081
ai.service.url=http://localhost:8000
