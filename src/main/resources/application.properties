spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Local FastAPI remains the development default; Railway can set AI_SERVICE_URL.
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/session-schema.sql,classpath:db/account-deletion.sql
spring.jpa.defer-datasource-initialization=true
server.port=${PORT:8081}
# Expose only the non-sensitive health endpoint to deployment probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Rotate pooled connections before upstream PostgreSQL idle connection expiry.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
