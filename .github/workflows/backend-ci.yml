name: Backend quality gate
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java 21 Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finflow_test
          POSTGRES_USER: finflow_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow_test -d finflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: finflow-ci-only-signing-key-never-use-outside-tests-2026
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finflow_test
      SPRING_DATASOURCE_USERNAME: finflow_test
      SPRING_DATASOURCE_PASSWORD: test_only_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
