name: FinFlow P1 production smoke
on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: read

jobs:
  public-smoke:
    name: Live web, API and CORS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public frontend is Angular, not a login/protection page
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://finflow-opal-five.vercel.app"
          status=$(curl -sSL --retry 2 --retry-all-errors --retry-delay 5 \
            --max-time 120 -o /tmp/finflow-index.html -w '%{http_code}' "$SITE/")
          echo "Frontend HTTP status: $status"
          test "$status" = "200" || { echo "::error::Frontend is not publicly serving HTTP 200"; exit 1; }
          grep -qi '<app-root' /tmp/finflow-index.html || { \
            echo "::error::Frontend does not serve the Angular application shell"; exit 1; }

      - name: Measure first and immediate follow-up API latency (no retries)
        shell: bash
        env:
          API: https://finflow-backend-production.up.railway.app
        run: |
          set -euo pipefail
          for sample in first second; do
            # No -f: anonymous /auth/me must return 401 or 403.
            # Do not retry: a timeout must never look like a passing smoke test.
            result=$(curl -sS --retry 0 --connect-timeout 4 --max-time 8 \
              -o /dev/null -w '%{http_code} %{time_total}' "$API/auth/me") || {
              echo "::error::No HTTP response on $sample API request"
              exit 1
            }
            read -r status elapsed <<< "$result"
            echo "$sample request: HTTP $status in ${elapsed}s"
            [[ "$status" = "401" || "$status" = "403" ]] || {
              echo "::error::Anonymous /auth/me returned unexpected HTTP $status"
              exit 1
            }
            awk -v duration="$elapsed" 'BEGIN { exit !(duration < 5) }' || {
              echo "::error::$sample API request exceeded 5-second latency budget"
              exit 1
            }
          done
      - name: Check API denies anonymous financial access
        shell: bash
        run: |
          set -euo pipefail
          API="https://finflow-backend-production.up.railway.app"
          status=$(curl -sS --retry 2 --retry-all-errors --retry-delay 5 \
            --max-time 120 -o /tmp/finflow-unauthenticated -w '%{http_code}' "$API/auth/me")
          echo "Unauthenticated /auth/me HTTP status: $status"
          [[ "$status" = "401" || "$status" = "403" ]] || { \
            echo "::error::Authenticated profile endpoint did not reject anonymous request"; exit 1; }

      - name: Check public versioned privacy policy and deny anonymous receipt
        shell: bash
        run: |
          set -euo pipefail
          API="https://finflow-backend-production.up.railway.app"
          status=$(curl -sS --retry 3 --retry-all-errors --max-time 60 \
            -o /tmp/finflow-privacy-policy -w '%{http_code}' "$API/privacy/policy")
          test "$status" = "200" || { echo "::error::Privacy policy endpoint is not public"; exit 1; }
          python3 - <<'PY'
          import json
          with open('/tmp/finflow-privacy-policy',encoding='utf-8') as f:
              policy=json.load(f)
          assert policy.get('version') == '2026-11-09-v1', policy
          assert isinstance(policy.get('ready'), bool), policy
          print('Versioned privacy policy reachable; legal readiness:',policy['ready'])
          PY
          status=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' "$API/privacy/status")
          [[ "$status" = "401" || "$status" = "403" ]] || {
            echo "::error::Anonymous privacy status unexpectedly accessible"; exit 1;
          }

      - name: Check allowed frontend origin and blocked untrusted origin
        shell: bash
        run: |
          set -euo pipefail
          API="https://finflow-backend-production.up.railway.app"
          curl -sS --retry 2 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X OPTIONS -H 'Origin: https://finflow-opal-five.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -D /tmp/finflow-cors-allowed -o /dev/null "$API/auth/login"
          grep -qi '^access-control-allow-origin: https://finflow-opal-five.vercel.app' \
            /tmp/finflow-cors-allowed || { \
            echo "::error::Production frontend origin is not permitted by backend CORS"; exit 1; }
          curl -sS --max-time 120 -X OPTIONS \
            -H 'Origin: https://untrusted.invalid' \
            -H 'Access-Control-Request-Method: POST' \
            -D /tmp/finflow-cors-blocked -o /dev/null "$API/auth/login"
          if grep -qi '^access-control-allow-origin:' /tmp/finflow-cors-blocked; then
            echo "::error::Untrusted origin unexpectedly permitted by CORS"
            exit 1
          fi
          echo "CORS policy confirmed"
